name: Release evidence

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance:production
      - run: pnpm release:metadata
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/release/sbom.cdx.json
            artifacts/release/provenance.intoto.jsonl
            artifacts/conformance/production-native.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/conformance/production-native.json
          if-no-files-found: error
          retention-days: 90
