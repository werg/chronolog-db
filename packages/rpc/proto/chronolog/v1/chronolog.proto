syntax = "proto3";

package chronolog.v1;

// Canonical bytes are raw bytes here and unpadded base64url in the JSON RPC
// transport. SQL source is UTF-8 text and is never rendered from another IR.
message Revision {
  string group_id = 1;
  uint64 event_set_revision = 2;
  uint64 materialized_revision = 3;
  uint64 published_order_length = 4;
  bytes execution_manifest_digest = 5;
  bool replaying = 6;
}
message StatusRequest { optional string group_id = 1; string request_id = 2; }
message StatusStreamRequest { optional string group_id = 1; string request_id = 2; optional uint64 resume_after_event_set_revision = 3; }
message NodeStatus { string api_version = 1; string state = 2; string node_id = 3; optional Revision revision = 4; bool writable = 5; bool validating = 6; optional string last_error_code = 7; }

message LocalSqlValue { string kind = 1; optional string exact_value = 2; optional double real_value = 3; optional bytes blob_value = 4; }
message LocalSqlRow { repeated LocalSqlValue values = 1; }
message LocalSqlColumn { string name = 1; optional string declared_type = 2; }
message LocalSqlRequest { string group_id = 1; string request_id = 2; string sql = 3; repeated LocalSqlValue parameters = 4; optional uint32 max_rows = 5; optional uint64 at_revision = 6; }
message LocalSqlResult { repeated LocalSqlColumn columns = 1; repeated LocalSqlRow rows = 2; bool truncated = 3; }
message LocalSqlResponse { Revision revision = 1; LocalSqlResult result = 2; }
message LiveSqlCursor { string group_id = 1; bytes query_digest = 2; uint64 event_set_revision = 3; }
message LiveSqlRequest { string group_id = 1; string request_id = 2; string sql = 3; repeated LocalSqlValue parameters = 4; optional uint32 max_rows = 5; optional LiveSqlCursor resume = 6; }
message LiveSqlEvent { string type = 1; Revision revision = 2; bytes query_digest = 3; optional LocalSqlResult result = 4; optional uint64 previous_materialized_revision = 5; optional string reset_reason = 6; }

message SqlBinding {
  oneof parameter { uint32 parameter_index = 1; string parameter_name = 2; }
  bytes canonical_logical_value = 3;
}
message SqlStatement { string sql = 1; repeated SqlBinding bindings = 2; }
message CanonicalSqlResult { string result_mode = 1; bytes canonical_result = 2; bytes result_digest = 3; }

message BeginDraftRequest { string group_id = 1; string request_id = 2; optional uint64 at_revision = 3; optional uint64 ttl_ms = 4; }
message BeginDraftResponse { string draft_id = 1; Revision pinned_revision = 2; bytes execution_manifest_digest = 3; sint64 reserved_author_timestamp_ms = 4; bytes transaction_nonce = 5; string expires_at = 6; }
message DraftReference { string group_id = 1; string draft_id = 2; string request_id = 3; }
message ObserveSqlRequest { string group_id = 1; string draft_id = 2; string request_id = 3; SqlStatement statement = 4; string result_mode = 5; optional string application_label = 6; }
message ObserveSqlResponse { string observation_id = 1; string observation_token = 2; Revision revision = 3; SqlStatement statement = 4; CanonicalSqlResult result = 5; }

message ObservationExpectation { string observation_id = 1; string observation_token = 2; }
message InlineExpectation { uint32 id = 1; SqlStatement statement = 2; string result_mode = 3; bytes canonical_result = 4; }
message DigestExpectation { uint32 id = 1; SqlStatement statement = 2; string result_mode = 3; bytes result_digest = 4; }
message AssertTrueExpectation { uint32 id = 1; SqlStatement statement = 2; }
message AddPreconditionRequest {
  string group_id = 1; string draft_id = 2; string request_id = 3;
  oneof source { ObservationExpectation observation = 4; InlineExpectation inline = 5; DigestExpectation digest = 6; AssertTrueExpectation assert_true = 7; }
  optional string application_label = 8;
}
message AddStatementsRequest { string group_id = 1; string draft_id = 2; string request_id = 3; repeated SqlStatement statements = 4; }
message ReplaceStatementsRequest { string group_id = 1; string draft_id = 2; string request_id = 3; repeated SqlStatement statements = 4; }
message SqlDiagnostic { string code = 1; string severity = 2; optional uint32 precondition_index = 3; optional uint32 statement_index = 4; optional uint32 start_byte = 5; optional uint32 end_byte = 6; optional string application_label = 7; }
message DraftMutationResponse { string draft_id = 1; uint64 draft_revision = 2; uint32 precondition_count = 3; uint32 statement_count = 4; repeated SqlDiagnostic diagnostics = 5; string expires_at = 6; }
message RebaseDraftRequest { string group_id = 1; string draft_id = 2; string request_id = 3; optional uint64 to_revision = 4; bool refresh_observations = 5; bool renew_context = 6; }
message RefreshedObservation { ObserveSqlResponse observation = 1; bool changed = 2; }
message RebaseDraftResponse { DraftMutationResponse draft = 1; Revision pinned_revision = 2; bytes execution_manifest_digest = 3; sint64 reserved_author_timestamp_ms = 4; bytes transaction_nonce = 5; repeated RefreshedObservation refreshed_observations = 6; repeated string invalidated_observation_ids = 7; }
message CancelDraftResponse { string draft_id = 1; bool cancelled = 2; }
message PublishDraftRequest { string group_id = 1; string draft_id = 2; string request_id = 3; string idempotency_key = 4; }
message PublishDraftResponse { string transaction_id = 1; bytes candidate_digest = 2; sint64 author_timestamp_ms = 3; bytes transaction_nonce = 4; bytes execution_manifest_digest = 5; bool durable_local_append = 6; string published_at = 7; }

message TransactionRequest { string group_id = 1; string transaction_id = 2; string request_id = 3; optional uint64 resume_after_event_set_revision = 4; }
message AcceptedResultReference { uint32 envelope_version = 1; bytes digest = 2; uint64 byte_length = 3; }
message CanonicalSchemaIdentity { string database = 1; string object_kind = 2; bytes object_name_utf8 = 3; optional bytes containing_object_name_utf8 = 4; }
message RejectionAttribution { string phase = 1; string code = 2; optional uint32 precondition_id = 3; optional uint32 precondition_index = 4; optional uint32 statement_index = 5; optional CanonicalSchemaIdentity constraint_identity = 6; optional CanonicalSchemaIdentity trigger_identity = 7; optional string application_label = 8; }
message TransactionOutcome { string transaction_id = 1; string phase = 2; string outcome_type = 3; optional AcceptedResultReference accepted_result = 4; optional RejectionAttribution rejection = 5; uint64 event_set_revision = 6; uint64 materialized_revision = 7; optional string order_key = 8; bool changed_by_replay = 9; bool admissible = 10; string observed_at = 11; }
message GetTransactionResultRequest { string group_id = 1; string transaction_id = 2; string request_id = 3; optional uint64 at_materialized_revision = 4; }
message GetTransactionResultResponse { Revision revision = 1; string transaction_id = 2; AcceptedResultReference reference = 3; bytes canonical_envelope = 4; }

message SettlementEvidence { string transaction_id = 1; TransactionOutcome outcome = 2; uint64 evidence_revision = 3; string order_key = 4; sint64 author_timestamp_ms = 5; bytes validation_policy_id = 6; bytes membership_revision = 7; optional sint64 policy_watermark_ms = 8; string confidence = 9; string calculated_at = 10; }
message ValidatorWatermark { string group_id = 1; uint64 revision = 2; bytes policy_id = 3; bytes membership_revision = 4; optional sint64 timestamp_ms = 5; repeated bytes supporting_validators = 6; repeated bytes blocked_by = 7; }
message ReplicationStatus { string group_id = 1; uint64 revision = 2; uint32 connected_peers = 3; uint32 known_peers = 4; uint32 feeds_with_gaps = 5; uint32 pending_payloads = 6; uint32 ingestion_backlog = 7; bool materialization_pending = 8; string state = 9; }

message GovernanceCapability {
  bytes capability_id = 1;
  bytes subject_id = 2;
  bytes signing_public_key = 3;
  optional string transport_author = 4;
  string role = 5;
  uint64 valid_from_revision = 6;
  optional uint64 valid_until_revision = 7;
  optional uint64 revoked_at_revision = 8;
  bool active = 9;
  optional string organization = 10;
  optional string validator_class = 11;
  optional string reader_scope = 12;
  optional bytes hpke_public_key = 13;
}
message GovernanceStatus {
  string group_id = 1;
  uint64 revision = 2;
  bytes revision_digest = 3;
  bytes root_admin_public_key = 4;
  string capability_log_feed = 5;
  optional uint64 current_epoch = 6;
  bool history_reopened = 7;
  repeated GovernanceCapability capabilities = 8;
}
message GrantCapabilityRequest {
  string group_id = 1; string request_id = 2; bytes subject_id = 3; bytes signing_public_key = 4;
  optional string transport_author = 5; string role = 6; optional uint64 valid_until_revision = 7;
  optional string organization = 8; optional string validator_class = 9;
  optional sint64 minimum_author_timestamp_ms = 10; optional string reader_scope = 11;
  optional bytes hpke_public_key = 12;
}
message GrantCapabilityResponse { uint64 revision = 1; bytes capability_id = 2; }
message RevokeCapabilitiesRequest { string group_id = 1; string request_id = 2; repeated bytes capability_ids = 3; }
message RevokeCapabilitiesResponse { uint64 revision = 1; repeated bytes revoked_capability_ids = 2; }
message RotateEpochResponse { uint64 epoch = 1; }
message GrantHistoricalAccessRequest { string group_id = 1; string request_id = 2; bytes subject_id = 3; }
message GrantHistoricalAccessResponse { uint32 epoch_manifests_published = 1; }
message PublishRecoveryRequest { string group_id = 1; string request_id = 2; bytes canonical_recovery_record = 3; }
message PublishRecoveryResponse { bool published = 1; }

service NodeService {
  rpc GetStatus(StatusRequest) returns (NodeStatus);
  rpc StreamStatus(StatusStreamRequest) returns (stream NodeStatus);
  rpc GetReplicationStatus(StatusRequest) returns (ReplicationStatus);
  rpc StreamReplicationStatus(StatusStreamRequest) returns (stream ReplicationStatus);
}
service QueryService { rpc LocalSql(LocalSqlRequest) returns (LocalSqlResponse); rpc LiveSql(LiveSqlRequest) returns (stream LiveSqlEvent); }
service TransactionService {
  rpc BeginDraft(BeginDraftRequest) returns (BeginDraftResponse);
  rpc ObserveSql(ObserveSqlRequest) returns (ObserveSqlResponse);
  rpc AddPrecondition(AddPreconditionRequest) returns (DraftMutationResponse);
  rpc AddStatements(AddStatementsRequest) returns (DraftMutationResponse);
  rpc ReplaceStatements(ReplaceStatementsRequest) returns (DraftMutationResponse);
  rpc ValidateDraft(DraftReference) returns (DraftMutationResponse);
  rpc RebaseDraft(RebaseDraftRequest) returns (RebaseDraftResponse);
  rpc CancelDraft(DraftReference) returns (CancelDraftResponse);
  rpc PublishDraft(PublishDraftRequest) returns (PublishDraftResponse);
  rpc GetOutcome(TransactionRequest) returns (TransactionOutcome);
  rpc GetResult(GetTransactionResultRequest) returns (GetTransactionResultResponse);
  rpc StreamOutcome(TransactionRequest) returns (stream TransactionOutcome);
}
service EvidenceService {
  rpc GetSettlement(TransactionRequest) returns (SettlementEvidence);
  rpc StreamSettlement(TransactionRequest) returns (stream SettlementEvidence);
  rpc GetValidatorWatermark(StatusRequest) returns (ValidatorWatermark);
}
service GovernanceService {
  rpc GetStatus(StatusRequest) returns (GovernanceStatus);
  rpc GrantCapability(GrantCapabilityRequest) returns (GrantCapabilityResponse);
  rpc RevokeCapabilities(RevokeCapabilitiesRequest) returns (RevokeCapabilitiesResponse);
  rpc RotateEpoch(StatusRequest) returns (RotateEpochResponse);
  rpc GrantHistoricalAccess(GrantHistoricalAccessRequest) returns (GrantHistoricalAccessResponse);
  rpc PublishRecovery(PublishRecoveryRequest) returns (PublishRecoveryResponse);
}
